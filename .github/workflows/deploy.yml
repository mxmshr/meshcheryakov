name: Deploy to Beget

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version asset links so browsers never mix new pages with cached old CSS/JS
        run: python3 .github/version-assets.py .

      - name: Exclude git metadata and source files from deploy
        run: rm -rf .git img/uncompressed

      - name: Deploy to Beget
        uses: appleboy/scp-action@v0.1.7
        with:
          host: maximm.beget.tech
          username: maximm
          key: ${{ secrets.BEGET_SSH_KEY }}
          source: "*,.htaccess"
          target: "/home/m/maximm/meshcheryakov.com/public_html"
          strip_components: 0
          overwrite: true
          tar_dereference: true
